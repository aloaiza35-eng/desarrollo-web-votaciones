{% if form.errors %}<div class="form-summary" role="alert">Revisa los datos indicados antes de continuar.{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
